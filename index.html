<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Global Blob.io + Voice Chat</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #121212; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; background: #1a1a2e; }

    /* UI Arayüz */
    #ui-container { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; }
    .hud-box { background: rgba(0, 0, 0, 0.65); padding: 8px 15px; border-radius: 20px; color: #fff; font-weight: bold; font-size: 14px; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1); }
    
    /* Butonlar */
    .btn { pointer-events: auto; background: #4e54c8; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .btn:active { transform: scale(0.95); }
    .btn-mic-on { background: #00b09b !important; }

    /* Chat Kutusu */
    #chat-container { position: absolute; bottom: 15px; left: 15px; width: 260px; max-height: 200px; background: rgba(0, 0, 0, 0.6); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; pointer-events: auto; z-index: 10; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1); }
    #chat-messages { flex: 1; overflow-y: auto; color: white; font-size: 12px; margin-bottom: 8px; max-height: 120px; word-break: break-word; }
    #chat-messages p { margin: 3px 0; }
    #chat-input { background: rgba(255, 255, 255, 0.15); border: none; padding: 8px; border-radius: 8px; color: white; outline: none; font-size: 12px; }
    #chat-input::placeholder { color: #ccc; }

    /* Bildirim */
    #status-msg { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #00ffcc; padding: 5px 15px; border-radius: 15px; font-size: 12px; pointer-events: none; z-index: 10; }
  </style>
</head>
<body>

  <div id="ui-container">
    <div class="hud-box">Skor: <span id="score">0</span> | Oyuncular: <span id="online-count">1</span></div>
    <button id="mic-btn" class="btn" onclick="toggleMic()">🎤 Mikrofonu Aç</button>
  </div>

  <div id="status-msg">Ortak Sunucuya Bağlanılıyor...</div>

  <div id="chat-container">
    <div id="chat-messages"><p style="color:#888;"><i>Sohbet Başlatıldı...</i></p></div>
    <input type="text" id="chat-input" placeholder="Mesaj yazıp Enter'a bas..." onkeydown="sendChat(event)">
  </div>

  <canvas id="gameCanvas"></canvas>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
    const GLOBAL_ROOM_ID = "blob-io-global-server-hatay-v1"; // Herkesi tek sunucuda buluşturan sabit kimlik
    const MAP_SIZE = 2500;
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let localStream = null;
    let micEnabled = false;
    let peer = null;
    let connections = {};
    let calls = {};

    let myId = "user_" + Math.random().toString(36).substring(2, 7);
    let players = {};
    let foods = [];

    // Oyuncu Başlangıç
    players[myId] = {
      x: Math.random() * (MAP_SIZE - 200) + 100,
      y: Math.random() * (MAP_SIZE - 200) + 100,
      radius: 25,
      color: `hsl(${Math.random() * 360}, 85%, 60%)`,
      score: 0,
      name: "Oyuncu_" + myId.substring(5)
    };

    // Sabit Yem Tohumlama (Ortak Dünya Hissiyatı)
    for (let i = 0; i < 200; i++) {
      foods.push({
        id: i,
        x: (i * 137.5) % MAP_SIZE,
        y: (i * 293.7) % MAP_SIZE,
        color: `hsl(${(i * 13) % 360}, 75%, 50%)`
      });
    }

    let targetPos = { x: players[myId].x, y: players[myId].y };

    // --- PEERJS OTOMATİK ORTAK SUNUCU AĞI ---
    function initNetwork() {
      peer = new Peer(myId);

      peer.on('open', (id) => {
        document.getElementById('status-msg').innerText = "Ortak Sunucuya Katıldın!";
        setTimeout(() => document.getElementById('status-msg').style.display = 'none', 3000);
        connectToGlobalHost();
      });

      peer.on('connection', (conn) => {
        setupDataConnection(conn);
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        call.on('stream', (remoteStream) => {
          playRemoteAudio(call.peer, remoteStream);
        });
      });
    }

    function connectToGlobalHost() {
      // Global Lider/Host Bağlantısı
      let hostConn = peer.connect(GLOBAL_ROOM_ID);
      setupDataConnection(hostConn);

      // Eğer Global Host yoksa kendini yedek host ilan et
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          // Sabit ID doluysa başka oyunculara bağlan
        }
      });
    }

    function setupDataConnection(conn) {
      connections[conn.peer] = conn;

      conn.on('open', () => {
        updateOnlineCount();
        // Sesli sohbet araması başlat
        if (localStream) {
          let call = peer.call(conn.peer, localStream);
          call.on('stream', (remoteStream) => playRemoteAudio(conn.peer, remoteStream));
        }
      });

      conn.on('data', (data) => {
        if (data.type === 'sync') {
          players[data.id] = data.player;
        } else if (data.type === 'chat') {
          addChatMessage(data.name, data.msg);
        } else if (data.type === 'eatFood') {
          foods[data.foodIndex].x = Math.random() * MAP_SIZE;
          foods[data.foodIndex].y = Math.random() * MAP_SIZE;
        }
      });

      conn.on('close', () => {
        delete connections[conn.peer];
        delete players[conn.peer];
        updateOnlineCount();
      });
    }

    function broadcast(data) {
      Object.values(connections).forEach(conn => {
        if (conn.open) conn.send(data);
      });
    }

    // --- MİKROFON VE SES KONTROLÜ ---
    async function toggleMic() {
      const micBtn = document.getElementById('mic-btn');
      if (!micEnabled) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          micEnabled = true;
          micBtn.innerText = "🎤 Mikrofon Açık";
          micBtn.classList.add('btn-mic-on');

          // Bağlı olunan tüm oyunculara ses akışını gönder
          Object.keys(connections).forEach(peerId => {
            let call = peer.call(peerId, localStream);
            call.on('stream', (remoteStream) => playRemoteAudio(peerId, remoteStream));
          });
        } catch (err) {
          alert("Mikrofon izni verilemedi!");
        }
      } else {
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
        }
        micEnabled = false;
        micBtn.innerText = "🎤 Mikrofonu Aç";
        micBtn.classList.remove('btn-mic-on');
      }
    }

    function playRemoteAudio(peerId, stream) {
      let audio = document.getElementById("audio-" + peerId);
      if (!audio) {
        audio = document.createElement('audio');
        audio.id = "audio-" + peerId;
        audio.autoplay = true;
        document.body.appendChild(audio);
      }
      audio.srcObject = stream;
    }

    // --- CHAT SİSTEMİ ---
    function sendChat(e) {
      if (e.key === 'Enter') {
        const input = document.getElementById('chat-input');
        const msg = input.value.trim();
        if (msg) {
          addChatMessage("Sen", msg);
          broadcast({ type: 'chat', name: players[myId].name, msg: msg });
          input.value = '';
        }
      }
    }

    function addChatMessage(author, msg) {
      const container = document.getElementById('chat-messages');
      const p = document.createElement('p');
      p.innerHTML = `<b>${author}:</b> ${msg}`;
      container.appendChild(p);
      container.scrollTop = container.scrollHeight;
    }

    function updateOnlineCount() {
      document.getElementById('online-count').innerText = Object.keys(connections).length + 1;
    }

    // --- DOKUNMATİK & FARE KONTROLLERİ ---
    window.addEventListener('touchmove', (e) => {
      targetPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });

    window.addEventListener('mousemove', (e) => {
      targetPos = { x: e.clientX, y: e.clientY };
    });

    // --- OYUN DÖNGÜSÜ & FİZİK ---
    function updateGame() {
      let me = players[myId];
      if (!me) return;

      let dx = targetPos.x - (canvas.width / 2);
      let dy = targetPos.y - (canvas.height / 2);
      let dist = Math.hypot(dx, dy);

      if (dist > 10) {
        let speed = Math.max(2.5, 8 - me.radius * 0.03);
        me.x += (dx / dist) * speed;
        me.y += (dy / dist) * speed;

        // Harita Sınırları
        me.x = Math.max(me.radius, Math.min(MAP_SIZE - me.radius, me.x));
        me.y = Math.max(me.radius, Math.min(MAP_SIZE - me.radius, me.y));
      }

      // Yem Yeme
      foods.forEach((f, index) => {
        if (Math.hypot(me.x - f.x, me.y - f.y) < me.radius) {
          me.radius += 0.3;
          me.score += 10;
          f.x = Math.random() * MAP_SIZE;
          f.y = Math.random() * MAP_SIZE;
          broadcast({ type: 'eatFood', foodIndex: index });
        }
      });

      // Diğer Oyuncuları Yeme
      Object.keys(players).forEach(id => {
        if (id !== myId) {
          let other = players[id];
          let d = Math.hypot(me.x - other.x, me.y - other.y);
          if (d < me.radius && me.radius > other.radius * 1.15) {
            me.radius += other.radius * 0.2;
            me.score += 100;
          }
        }
      });

      // Durumu Ağdaki Herkese Yayınla
      broadcast({ type: 'sync', id: myId, player: me });
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let me = players[myId];
      if (!me) return;

      document.getElementById('score').innerText = Math.floor(me.score);

      ctx.save();
      // Kamerayı Merkezde Tut
      ctx.translate(canvas.width / 2 - me.x, canvas.height / 2 - me.y);

      // Harita Sınır Çizgisi
      ctx.strokeStyle = "rgba(255,255,255,0.15)";
      ctx.lineWidth = 10;
      ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

      // Yemleri Çiz
      foods.forEach(f => {
        ctx.beginPath();
        ctx.arc(f.x, f.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = f.color;
        ctx.fill();
      });

      // Tüm Oyuncuları Çiz
      Object.keys(players).forEach(id => {
        let p = players[id];
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.stroke();

        // İsim Yazısı
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x, p.y - p.radius - 8);
      });

      ctx.restore();
    }

    function loop() {
      updateGame();
      render();
      requestAnimationFrame(loop);
    }

    // Başlat
    initNetwork();
    loop();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
